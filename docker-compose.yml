version: '3.8'

services:

  postgres:
    image: postgres:18-alpine
    container_name: saojoao_postgres
    environment:
      POSTGRES_DB: saojoao_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: saojoao_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: postgres
      PGADMIN_DEFAULT_PASSWORD: MarkAdmin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # api:
      # build: .
      # container_name: saojoao_api
      # environment:
    #  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/saojoao_db
